    <form>
      <label for="a">Name: </label>
      <input id="a" type="text" /><br />

      <label for="b">Email: </label>
      <input id="b" type="email" /><br />

      <label for="c">DOB: </label>
      <input id="c" type="date" /><br />

      <label for="d">Password: </label>
      <input id="d" type="password" /><br />

      <label for="e">Phone : </label>
      <input id="e" type="tel" /><br />

      <label for="f">Count : </label>
      <input id="f" type="number" min="5" max="10" /><br />

      <label for="g">Range : </label>
      <input id="g" type="range" min="15" max="50" /><br />

      <label for="h">Time : </label>
      <input id="h" type="time" /><br />

      <label for="i">Resume : </label>
      <input id="i" type="file" /><br />

      <p>Gender</p>

      <label for="r">Male</label>
      <input id="r" type="radio" name="gender" />
      <label for="s">Female</label>
      <input id="s" type="radio" name="gender" />
      <label for="t">Others</label>
      <input id="t" type="radio" name="gender" />

      <br />
      <br />

      <p>Skills</p>
      <label for="x">Dancing</label>
      <input id="x" type="checkbox" name="skill" />
      <label for="y">Gaming</label>
      <input id="y" type="checkbox" name="skill" />
      <label for="z">Singing</label>
      <input id="z" type="checkbox" name="skill" />

      <br />
      <br />

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
       <button type="button">Save</button>
    </form>
  </body>
</html>
